name: CI devops 2026

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  # Job 1 : Compile, test and analyze Java code
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Build and test the application
      - name: Build and test with Maven
        run: mvn clean verify --file ./simple-api/pom.xml

      # Analyze code quality with SonarCloud
      - name: Analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify sonar:sonar
          -Dsonar.projectKey=arielYAPO_tp-devops-correction-docker
          -Dsonar.organization=arielyapo
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
          --file ./simple-api/pom.xml

  # Job 2 : Build and publish Docker images
  build-and-push-docker-image:
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Java API image
      - name: Build and push Docker image API
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Build and push PostgreSQL image
      - name: Build and push Docker image Database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Build and push HTTP server image
      - name: Build and push Docker image HTTPD
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}